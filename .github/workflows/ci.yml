name: Bitgeist CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Lint, Regression Suite & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Automated regression suite (Rate limit, Tag claim, SQLite Top-10, Headless WASM Anti-Cheat)
        run: npm test

      - name: Next.js production build
        run: npm run build
